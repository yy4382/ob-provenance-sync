name: Release plugin

# Push a tag equal to the manifest version (e.g. 0.1.0). BRAT installs from
# the release assets and reads manifest.json from the repository root.
on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the manifest
        run: test "$(node -p 'require("./manifest.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm --filter @provenance/obsidian build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            apps/obsidian/main.js apps/obsidian/manifest.json apps/obsidian/styles.css
